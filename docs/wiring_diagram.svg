<text x="367" y="545" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">220 ohm</text>
<line x1="390" y1="545" x2="415" y2="545" stroke="#3d3d3a" stroke-width="0.5"/>
<polygon points="415,533 415,557 440,545" fill="#E24B4A" opacity="0.8" stroke="#501313" stroke-width="0.5"/>
<line x1="440" y1="533" x2="440" y2="557" stroke="#501313" stroke-width="2"/>
<line x1="440" y1="545" x2="460" y2="545" stroke="#3d3d3a" stroke-width="0.5"/>
<line x1="460" y1="545" x2="460" y2="480" stroke="#3d3d3a" stroke-width="0.5" stroke-dasharray="2 2"/>

<rect x="310" y="605" width="300" height="26" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="460" y="618" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#4A1B0C">Ground rail (shared GND)</text>
<line x1="350" y1="480" x2="350" y2="605" stroke="#3d3d3a" stroke-width="0.5" stroke-dasharray="2 2"/>
<line x1="460" y1="480" x2="460" y2="605" stroke="#3d3d3a" stroke-width="0.5" stroke-dasharray="2 2"/>

<rect x="30" y="200" width="140" height="440" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="100" y="226" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Arduino Uno</text>

<line x1="170" y1="260" x2="182" y2="260" stroke="#3d3d3a" stroke-width="0.5"/>
<text x="60" y="264" font-family="sans-serif" font-size="12" fill="#5F5E5A">5V</text>
<line x1="170" y1="300" x2="182" y2="300" stroke="#3d3d3a" stroke-width="0.5"/>
<text x="55" y="304" font-family="sans-serif" font-size="12" fill="#5F5E5A">GND</text>
<line x1="170" y1="340" x2="182" y2="340" stroke="#3d3d3a" stroke-width="0.5"/>
<text x="55" y="344" font-family="sans-serif" font-size="12" fill="#5F5E5A">A0</text>
<line x1="170" y1="380" x2="182" y2="380" stroke="#3d3d3a" stroke-width="0.5"/>
<text x="42" y="384" font-family="sans-serif" font-size="12" fill="#5F5E5A">A4 (SDA)</text>
<line x1="170" y1="420" x2="182" y2="420" stroke="#3d3d3a" stroke-width="0.5"/>
<text x="42" y="424" font-family="sans-serif" font-size="12" fill="#5F5E5A">A5 (SCL)</text>
<line x1="170" y1="475" x2="182" y2="475" stroke="#3d3d3a" stroke-width="0.5"/>
<text x="55" y="479" font-family="sans-serif" font-size="12" fill="#5F5E5A">D8</text>
<line x1="170" y1="575" x2="182" y2="575" stroke="#3d3d3a" stroke-width="0.5"/>
<text x="55" y="579" font-family="sans-serif" font-size="12" fill="#5F5E5A">D9</text>

<path d="M170,260 L290,260 L290,260 L310,260" fill="none" stroke="#3d3d3a" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M170,340 L280,340 L280,330 L310,330" fill="none" stroke="#3d3d3a" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M170,475 L295,475 L295,445 L310,445" fill="none" stroke="#3d3d3a" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M170,575 L295,575 L295,545 L310,545" fill="none" stroke="#3d3d3a" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M170,300 L260,300 L260,618 L310,618" fill="none" stroke="#3d3d3a" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M170,260 L200,260 L200,60 L460,60" fill="none" stroke="#3d3d3a" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M170,380 L235,380 L235,90 L460,90" fill="none" stroke="#3d3d3a" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M170,420 L250,420 L250,105 L460,105" fill="none" stroke="#3d3d3a" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M310,618 L215,618 L215,75 L460,75" fill="none" stroke="#3d3d3a" stroke-width="0.5" marker-end="url(#arrow)"/>

<circle cx="170" cy="260" r="2.5" fill="#3d3d3a"/>
<circle cx="310" cy="618" r="2.5" fill="#3d3d3a"/>
</svg>
