<svg width="680" height="700" viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg">
<title>Final wiring schematic for the temperature monitor</title>
<desc>Arduino Uno connected to a breadboard with a thermistor voltage divider, a blue LED, a red LED, a shared ground rail, and a separate I2C LCD module.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<pattern id="bbdots2" width="18" height="18" patternUnits="userSpaceOnUse">
<circle cx="9" cy="9" r="1.2" fill="#3d3d3a" opacity="0.25"/>
</pattern>
</defs>
<rect width="680" height="700" fill="#ffffff"/>

<rect x="460" y="40" width="180" height="90" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="550" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">LCD I2C module</text>
<text x="550" y="94" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">16x2 display</text>

<rect x="280" y="170" width="370" height="470" rx="14" fill="url(#bbdots2)" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="300" y="196" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Breadboard</text>

<rect x="310" y="210" width="300" height="180" rx="8" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="322" y="232" font-family="sans-serif" font-size="12" fill="#5F5E5A">Temperature sensor</text>
<line x1="310" y1="260" x2="350" y2="260" stroke="#3d3d3a" stroke-width="0.5"/>
<line x1="350" y1="260" x2="350" y2="275" stroke="#3d3d3a" stroke-width="0.5"/>
<rect x="330" y="275" width="40" height="45" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="350" y="297" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">NTC</text>
<circle cx="350" cy="330" r="3" fill="#3d3d3a"/>
<line x1="350" y1="330" x2="310" y2="330" stroke="#3d3d3a" stroke-width="0.5"/>
<line x1="350" y1="330" x2="350" y2="335" stroke="#3d3d3a" stroke-width="0.5"/>
<rect x="330" y="335" width="40" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="350" y="355" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">10k ohm</text>
<line x1="350" y1="375" x2="350" y2="480" stroke="#3d3d3a" stroke-width="0.5" stroke-dasharray="2 2"/>

<rect x="310" y="400" width="300" height="90" rx="8" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="322" y="420" font-family="sans-serif" font-size="12" fill="#5F5E5A">Blue LED, normal (D8)</text>
<line x1="310" y1="445" x2="345" y2="445" stroke="#3d3d3a" stroke-width="0.5"/>
<rect x="345" y="435" width="45" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="367" y="445" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">220 ohm</text>
<line x1="390" y1="445" x2="415" y2="445" stroke="#3d3d3a" stroke-width="0.5"/>
<polygon points="415,433 415,457 440,445" fill="#378ADD" opacity="0.8" stroke="#042C53" stroke-width="0.5"/>
<line x1="440" y1="433" x2="440" y2="457" stroke="#042C53" stroke-width="2"/>
<line x1="440" y1="445" x2="460" y2="445" stroke="#3d3d3a" stroke-width="0.5"/>
<line x1="460" y1="445" x2="460" y2="480" stroke="#3d3d3a" stroke-width="0.5" stroke-dasharray="2 2"/>

<rect x="310" y="500" width="300" height="90" rx="8" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="322" y="520" font-family="sans-serif" font-size="12" fill="#5F5E5A">Red LED, warning (D9)</text>
